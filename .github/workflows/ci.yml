name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://marketanalytica.com
      # TODO(M5+): Playwright e2e against a preview deploy, axe run on every
      # public route, and Lighthouse CI budgets per SPEC.md §18/§20.
