name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: typecheck / lint / test (pnpm + turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test
      - name: economic-layer tagging guard (no generic revenue fields)
        run: node scripts/check-layer-tagging.mjs

  forecast-service:
    name: forecast service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/forecast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
